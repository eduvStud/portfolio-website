<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="600">
      <stop offset="0%" stop-color="#0d0d14"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="cglow"><feGaussianBlur stdDeviation="2.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- architecture blocks -->
  <rect x="100" y="200" width="140" height="140" rx="2" stroke="#22c55e" stroke-width="1.2" fill="#22c55e" fill-opacity="0.03"/>
  <rect x="260" y="140" width="180" height="200" rx="2" stroke="#22c55e" stroke-width="1.2" fill="#22c55e" fill-opacity="0.04"/>
  <rect x="120" y="360" width="220" height="100" rx="2" stroke="#22c55e" stroke-width="1" fill="#22c55e" fill-opacity="0.03"/>
  <rect x="340" y="340" width="120" height="120" rx="2" stroke="#16a34a" stroke-width="1" fill="#16a34a" fill-opacity="0.02"/>
  <!-- connection lines -->
  <line x1="240" y1="270" x2="260" y2="240" stroke="#22c55e" stroke-width="1" opacity="0.35"/>
  <line x1="260" y1="340" x2="340" y2="400" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
  <line x1="240" y1="270" x2="340" y2="340" stroke="#16a34a" stroke-width="0.8" opacity="0.25"/>
  <!-- nodes -->
  <circle cx="240" cy="270" r="5" fill="#22c55e" opacity="0.8" filter="url(#cglow)"/>
  <circle cx="260" cy="240" r="4" fill="#22c55e" opacity="0.6"/>
  <circle cx="340" cy="400" r="4.5" fill="#22c55e" opacity="0.7"/>
  <!-- label -->
  <text x="300" y="500" text-anchor="middle" fill="#22c55e" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="0.3em" opacity="0.4">ARCHITECTURE</text>
  <text x="300" y="525" text-anchor="middle" fill="#22c55e" font-family="'Space Grotesk',sans-serif" font-size="36" font-weight="700">CMS</text>
</svg>