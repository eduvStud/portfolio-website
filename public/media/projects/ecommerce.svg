<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="600">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#161020"/>
    </linearGradient>
    <linearGradient id="eGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5733" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff8c66" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="eglow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#ff5733" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#grid)"/>
  <!-- dashboard panels -->
  <rect x="40" y="120" width="240" height="180" rx="3" stroke="#ff5733" stroke-width="1.2" fill="#ff5733" fill-opacity="0.04"/>
  <rect x="300" y="120" width="260" height="180" rx="3" stroke="#ff5733" stroke-width="1.2" fill="#ff5733" fill-opacity="0.03"/>
  <rect x="40" y="320" width="160" height="120" rx="3" stroke="#ff5733" stroke-width="1" fill="#ff5733" fill-opacity="0.03"/>
  <rect x="220" y="320" width="340" height="120" rx="3" stroke="#ff5733" stroke-width="1" fill="#ff5733" fill-opacity="0.04"/>
  <!-- chart lines -->
  <polyline points="60,260 100,220 140,190 180,210 220,170 260,150" stroke="#ff5733" stroke-width="2" fill="none" opacity="0.5" filter="url(#eglow)"/>
  <polyline points="320,260 370,230 410,240 450,200 490,180 530,160" stroke="#ff8c66" stroke-width="1.5" fill="none" opacity="0.35"/>
  <!-- data dots -->
  <circle cx="260" cy="150" r="5" fill="#ff5733" opacity="0.9"/>
  <circle cx="530" cy="160" r="4" fill="#ff8c66" opacity="0.7"/>
  <!-- label -->
  <text x="300" y="500" text-anchor="middle" fill="#ff5733" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="0.3em" opacity="0.4">E-COMMERCE</text>
  <text x="300" y="525" text-anchor="middle" fill="#ff5733" font-family="'Space Grotesk',sans-serif" font-size="36" font-weight="700">DASHBOARD</text>
</svg>