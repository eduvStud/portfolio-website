<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="600">
      <stop offset="0%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#101828"/>
    </linearGradient>
    <filter id="pglow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- mobile frame -->
  <rect x="215" y="70" width="170" height="340" rx="18" stroke="#60d5f5" stroke-width="2" fill="#60d5f5" fill-opacity="0.08"/>
  <rect x="222" y="82" width="156" height="316" rx="12" stroke="#60d5f5" stroke-width="1" fill="#60d5f5" fill-opacity="0.05"/>
  <!-- status bar -->
  <line x1="240" y1="100" x2="360" y2="100" stroke="#60d5f5" stroke-width="0.8" opacity="0.6"/>
  <!-- content blocks -->
  <rect x="240" y="120" width="120" height="16" rx="4" fill="#60d5f5" opacity="0.35"/>
  <rect x="240" y="144" width="90" height="8" rx="3" fill="#60d5f5" opacity="0.2"/>
  <rect x="240" y="168" width="120" height="50" rx="6" fill="#60d5f5" opacity="0.15"/>
  <rect x="240" y="230" width="120" height="36" rx="6" fill="#60d5f5" opacity="0.2"/>
  <rect x="240" y="278" width="120" height="50" rx="6" fill="#60d5f5" opacity="0.15"/>
  <rect x="240" y="340" width="55" height="36" rx="6" fill="#60d5f5" opacity="0.25"/>
  <rect x="305" y="340" width="55" height="36" rx="6" fill="#4db8d9" opacity="0.2"/>
  <!-- glow dot -->
  <circle cx="300" cy="400" r="30" fill="#60d5f5" opacity="0.1"/>
  <circle cx="300" cy="400" r="12" fill="#60d5f5" opacity="0.4" filter="url(#pglow)"/>
  <!-- label -->
  <text x="300" y="500" text-anchor="middle" fill="#60d5f5" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="0.3em" opacity="0.7">WEB APP</text>
  <text x="300" y="530" text-anchor="middle" fill="#60d5f5" font-family="'Space Grotesk',sans-serif" font-size="32" font-weight="700">GROWLINK</text>
</svg>