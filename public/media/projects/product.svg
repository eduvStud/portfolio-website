<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="600">
      <stop offset="0%" stop-color="#0a0f14"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="pGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60d5f5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4db8d9" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="pglow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- mobile frame -->
  <rect x="215" y="70" width="170" height="340" rx="18" stroke="#60d5f5" stroke-width="1.5" fill="#60d5f5" fill-opacity="0.03"/>
  <rect x="222" y="82" width="156" height="316" rx="12" stroke="#60d5f5" stroke-width="0.8" fill="#60d5f5" fill-opacity="0.02"/>
  <!-- status bar -->
  <line x1="240" y1="100" x2="360" y2="100" stroke="#60d5f5" stroke-width="0.5" opacity="0.3"/>
  <!-- content blocks -->
  <rect x="240" y="120" width="120" height="16" rx="4" fill="#60d5f5" opacity="0.15"/>
  <rect x="240" y="144" width="90" height="8" rx="3" fill="#60d5f5" opacity="0.08"/>
  <rect x="240" y="168" width="120" height="50" rx="6" fill="#60d5f5" opacity="0.06"/>
  <rect x="240" y="230" width="120" height="36" rx="6" fill="#60d5f5" opacity="0.08"/>
  <rect x="240" y="278" width="120" height="50" rx="6" fill="#60d5f5" opacity="0.06"/>
  <rect x="240" y="340" width="55" height="36" rx="6" fill="#60d5f5" opacity="0.1"/>
  <rect x="305" y="340" width="55" height="36" rx="6" fill="#4db8d9" opacity="0.08"/>
  <!-- glow dot -->
  <circle cx="300" cy="400" r="30" fill="#60d5f5" opacity="0.04"/>
  <circle cx="300" cy="400" r="12" fill="#60d5f5" opacity="0.15" filter="url(#pglow)"/>
  <!-- label -->
  <text x="300" y="490" text-anchor="middle" fill="#60d5f5" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="0.3em" opacity="0.4">PRODUCT</text>
  <text x="300" y="515" text-anchor="middle" fill="#60d5f5" font-family="'Space Grotesk',sans-serif" font-size="36" font-weight="700">MOBILE UI</text>
</svg>