<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="600">
      <stop offset="0%" stop-color="#0a0a10"/>
      <stop offset="100%" stop-color="#121020"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="sPulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="sglow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- central hub -->
  <circle cx="300" cy="280" r="100" fill="url(#sPulse)"/>
  <circle cx="300" cy="280" r="60" stroke="#f59e0b" stroke-width="1" fill="#f59e0b" fill-opacity="0.04"/>
  <circle cx="300" cy="280" r="30" stroke="#f59e0b" stroke-width="1.5" fill="#f59e0b" fill-opacity="0.06"/>
  <circle cx="300" cy="280" r="12" fill="#f59e0b" opacity="0.5" filter="url(#sglow)"/>
  <!-- satellite nodes -->
  <circle cx="120" cy="180" r="18" stroke="#f59e0b" stroke-width="1" fill="#f59e0b" fill-opacity="0.04"/>
  <circle cx="120" cy="180" r="5" fill="#f59e0b" opacity="0.7"/>
  <circle cx="500" cy="160" r="16" stroke="#f59e0b" stroke-width="1" fill="#f59e0b" fill-opacity="0.03"/>
  <circle cx="500" cy="160" r="4.5" fill="#f59e0b" opacity="0.65"/>
  <circle cx="140" cy="420" r="20" stroke="#f59e0b" stroke-width="0.8" fill="#f59e0b" fill-opacity="0.04"/>
  <circle cx="140" cy="420" r="5" fill="#f59e0b" opacity="0.6"/>
  <circle cx="480" cy="400" r="17" stroke="#d97706" stroke-width="0.8" fill="#d97706" fill-opacity="0.03"/>
  <circle cx="480" cy="400" r="4" fill="#f59e0b" opacity="0.55"/>
  <!-- connection mesh -->
  <line x1="300" y1="280" x2="120" y2="180" stroke="#f59e0b" stroke-width="0.8" opacity="0.2"/>
  <line x1="300" y1="280" x2="500" y2="160" stroke="#f59e0b" stroke-width="0.8" opacity="0.18"/>
  <line x1="300" y1="280" x2="140" y2="420" stroke="#f59e0b" stroke-width="0.8" opacity="0.22"/>
  <line x1="300" y1="280" x2="480" y2="400" stroke="#d97706" stroke-width="0.7" opacity="0.16"/>
  <line x1="120" y1="180" x2="500" y2="160" stroke="#f59e0b" stroke-width="0.5" opacity="0.1"/>
  <line x1="140" y1="420" x2="480" y2="400" stroke="#f59e0b" stroke-width="0.5" opacity="0.1"/>
  <!-- label -->
  <text x="300" y="505" text-anchor="middle" fill="#f59e0b" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="0.35em" opacity="0.4">SYSTEM INTEGRATION</text>
  <text x="300" y="530" text-anchor="middle" fill="#f59e0b" font-family="'Space Grotesk',sans-serif" font-size="30" font-weight="700">KINETIC LAB</text>
</svg>