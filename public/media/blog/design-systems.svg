<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="800" y2="500">
      <stop offset="0%" stop-color="#0f0a12"/>
      <stop offset="100%" stop-color="#1a1028"/>
    </linearGradient>
    <linearGradient id="dgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="dradial" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="dglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#dbg)"/>
  <!-- radial aura -->
  <circle cx="400" cy="230" r="200" fill="url(#dradial)"/>
  <!-- token rings -->
  <circle cx="400" cy="230" r="160" stroke="#c084fc" stroke-width="0.8" opacity="0.12" fill="none"/>
  <circle cx="400" cy="230" r="130" stroke="#a855f7" stroke-width="1" opacity="0.18" fill="none"/>
  <circle cx="400" cy="230" r="100" stroke="#c084fc" stroke-width="1.2" opacity="0.25" fill="none"/>
  <circle cx="400" cy="230" r="70" stroke="#a855f7" stroke-width="1.5" opacity="0.35" fill="none"/>
  <circle cx="400" cy="230" r="40" stroke="#c084fc" stroke-width="2" opacity="0.5" fill="none" filter="url(#dglow)"/>
  <!-- token dots on ring -->
  <circle cx="400" cy="70" r="6" fill="#c084fc" opacity="0.9" filter="url(#dglow)"/>
  <circle cx="540" cy="150" r="5" fill="#a855f7" opacity="0.7"/>
  <circle cx="530" cy="310" r="5.5" fill="#c084fc" opacity="0.8"/>
  <circle cx="400" cy="390" r="4.5" fill="#a855f7" opacity="0.7"/>
  <circle cx="270" cy="310" r="6" fill="#c084fc" opacity="0.85" filter="url(#dglow)"/>
  <circle cx="260" cy="150" r="5" fill="#a855f7" opacity="0.75"/>
  <!-- cross connector lines -->
  <line x1="270" y1="310" x2="530" y2="150" stroke="url(#dgrad)" stroke-width="0.8" opacity="0.3"/>
  <line x1="260" y1="150" x2="540" y2="310" stroke="url(#dgrad)" stroke-width="0.8" opacity="0.3"/>
  <line x1="400" y1="70" x2="400" y2="390" stroke="#c084fc" stroke-width="0.6" opacity="0.15"/>
  <line x1="240" y1="230" x2="560" y2="230" stroke="#c084fc" stroke-width="0.6" opacity="0.15"/>
  <!-- center -->
  <circle cx="400" cy="230" r="12" fill="#c084fc" opacity="0.4"/>
  <circle cx="400" cy="230" r="6" fill="#d8b4fe" opacity="0.8" filter="url(#dglow)"/>
  <!-- label -->
  <text x="400" y="430" text-anchor="middle" fill="#c084fc" font-family="'JetBrains Mono',monospace" font-size="14" letter-spacing="0.3em" opacity="0.5">DESIGN SYSTEMS</text>
  <text x="400" y="460" text-anchor="middle" fill="#c084fc" font-family="'Space Grotesk',sans-serif" font-size="44" font-weight="700" letter-spacing="-0.02em">TOKENS</text>
</svg>